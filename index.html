<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}
/* Layout: barra menu + schede in alto, fogli A4 al centro sul "banco", miniature delle pagine a destra */
:root{
  --desk:#e4e8ef; --chrome:#f8f9fc; --panel:#ffffff; --ink:#1a2130; --muted:#5b6578;
  --line:#cdd3de; --accent:#2a59a6; --accent-ink:#ffffff; --accent-soft:#e2eaf7;
  --danger:#b3412e; --ok:#2d7a4c; --shadow:0 1px 2px rgba(20,30,50,.08),0 8px 24px rgba(20,30,50,.10);
  /* il foglio resta carta bianca in entrambi i temi */
  --paper:#ffffff; --paper-ink:#121418; --paper-line:#2b2f36; --fill-ink:#121418; --fill-bg:#eef3fc; --bar:#4f81bd;
  --ui:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --doc:"Tinos","Times New Roman",Times,serif;
  --val:"Arimo",Arial,Helvetica,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#12161d; --chrome:#1b212b; --panel:#212834; --ink:#e6eaf2; --muted:#9aa4b6; --line:#343d4c;
  --accent:#7aa5ee; --accent-ink:#0f1726; --accent-soft:#25344d; --danger:#ef8a75; --ok:#7fcf9c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#12161d; --chrome:#1b212b; --panel:#212834; --ink:#e6eaf2; --muted:#9aa4b6; --line:#343d4c;
  --accent:#7aa5ee; --accent-ink:#0f1726; --accent-soft:#25344d; --danger:#ef8a75; --ok:#7fcf9c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.45); color-scheme:dark}

html,body{height:100%}
body{background:var(--desk);color:var(--ink);font-family:var(--ui);font-size:15px;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--chrome)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{display:flex;flex-direction:column;height:100%}

/* ---------- barra superiore ---------- */
.top{background:var(--chrome);border-bottom:1px solid var(--line);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));position:relative;z-index:40}
.row1{display:flex;align-items:center;gap:6px;min-height:46px}
.brand{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;margin-right:10px;white-space:nowrap}
.brand i{width:22px;height:26px;border:2px solid var(--accent);border-radius:3px;position:relative;display:inline-block}
.brand i::after{content:"";position:absolute;left:4px;right:4px;top:6px;height:2px;background:var(--accent);box-shadow:0 5px 0 var(--accent),0 10px 0 var(--accent)}
.menu{position:relative}
.menu>button{background:none;border:0;padding:8px 10px;border-radius:7px;cursor:pointer;font-size:15px}
.menu>button:hover,.menu.open>button{background:var(--accent-soft)}
.drop{position:absolute;top:calc(100% + 4px);left:0;min-width:250px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;display:none;z-index:50}
.menu.open .drop{display:block}
.drop button{display:flex;width:100%;justify-content:space-between;align-items:center;gap:16px;background:none;border:0;text-align:left;padding:10px 12px;border-radius:7px;cursor:pointer}
.drop button:hover{background:var(--accent-soft)}
.drop button small{color:var(--muted);font-size:12px}
.drop hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
.spacer{flex:1}
.prog{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px;white-space:nowrap}
.prog b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{width:90px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.cloudbtn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:6px 12px;cursor:pointer;font-size:13px;white-space:nowrap;color:var(--muted)}
.cloudbtn:hover{border-color:var(--accent)}
.cloudbtn .dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
.cloudbtn[data-s="ok"] .dot{background:var(--ok)}
.cloudbtn[data-s="sync"] .dot{background:#d99a1e;animation:pulse 1s infinite}
.cloudbtn[data-s="err"] .dot{background:var(--danger)}
.cloudbtn[data-s="out"]{color:var(--accent);border-color:var(--accent);font-weight:700}
.cloudbtn[data-s="out"] .dot{background:var(--accent)}
@keyframes pulse{50%{opacity:.35}}
.doclist{display:flex;flex-direction:column;gap:6px;max-height:52vh;overflow:auto;margin-top:10px}
.doclist .di{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.doclist .di .n{flex:1;min-width:0}
.doclist .di .n b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doclist .di .n small{color:var(--muted);font-variant-numeric:tabular-nums}
.fmsg{font-size:13px;margin:8px 0 0;min-height:18px}
.fmsg.err{color:var(--danger)}.fmsg.ok{color:var(--ok)}
.dlg label.fl{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.dlg input[type=email],.dlg input[type=password]{width:100%;box-sizing:border-box;font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--chrome);color:var(--ink)}
@media (max-width:560px){.cloudbtn .lbl{display:none}.cloudbtn{padding:9px}}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.danger{color:var(--danger)}

.row2{display:flex;align-items:flex-end;gap:8px;padding-top:4px}
.modsel{display:flex;align-items:center;gap:6px;padding-bottom:6px}
.modsel label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 30px 7px 10px;max-width:220px}
.plus{width:36px;height:36px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-size:22px;line-height:1;cursor:pointer;flex:none}
.tabs{display:flex;gap:2px;overflow-x:auto;min-width:0;flex:1;scrollbar-width:thin}
.tab{display:flex;align-items:center;gap:6px;padding:8px 8px 8px 12px;border:1px solid var(--line);border-bottom:0;border-radius:9px 9px 0 0;background:transparent;cursor:pointer;white-space:nowrap;max-width:230px;font-size:14px;color:var(--muted)}
.tab.on{background:var(--desk);color:var(--ink);font-weight:700;position:relative;top:1px}
.tab .nm{overflow:hidden;text-overflow:ellipsis}
.tab .x{border:0;background:none;width:22px;height:22px;border-radius:5px;cursor:pointer;color:var(--muted);font-size:16px;line-height:1}
.tab .x:hover{background:var(--accent-soft);color:var(--ink)}
.tab input{font:inherit;width:150px;border:1px solid var(--accent);border-radius:4px;padding:1px 4px;background:var(--panel);color:var(--ink)}

/* ---------- area di lavoro ---------- */
.work{flex:1;display:flex;min-height:0}
.scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;min-width:0}
#pages{padding:24px 0 120px;display:flex;flex-direction:column;align-items:center;gap:22px}
.side{width:212px;flex:none;border-left:1px solid var(--line);background:var(--chrome);display:flex;flex-direction:column}
.side h3{margin:0;padding:12px 14px 6px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.sideX{display:none;border:1px solid var(--line);background:var(--panel);width:34px;height:34px;border-radius:8px;font-size:20px;line-height:1;cursor:pointer}
.scrim{display:none}
.empty{max-width:420px;margin:60px auto;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:32px 24px;box-shadow:var(--shadow)}
.empty h2{margin:14px 0 6px;font-size:20px}
.empty p{color:var(--muted);margin:0 0 18px;line-height:1.45}
.emp-ico{width:54px;height:66px;margin:0 auto;border:3px solid var(--accent);border-radius:6px;position:relative}
.emp-ico::after{content:"";position:absolute;left:10px;right:10px;top:16px;height:3px;background:var(--accent);box-shadow:0 10px 0 var(--accent),0 20px 0 var(--accent)}
.thumbs{overflow:auto;padding:6px 14px 30px;display:flex;flex-direction:column;gap:14px}
.th{cursor:pointer;border:2px solid transparent;border-radius:6px;padding:3px;background:none;text-align:center;color:var(--muted);font-size:12px}
.th.on{border-color:var(--accent);color:var(--ink);font-weight:700}
.th .mini{width:170px;height:240px;overflow:hidden;background:#fff;box-shadow:var(--shadow);margin:0 auto 4px;position:relative;pointer-events:none}
.th .mini>.page{transform:scale(.2141);transform-origin:0 0;position:absolute;left:0;top:0;box-shadow:none}
.th .cnt{display:block;font-weight:400;font-variant-numeric:tabular-nums}
.zoombox{display:flex;gap:4px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);font-size:13px}
.zoombox button{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);background:var(--panel);cursor:pointer}
.zoombox span{flex:1;text-align:center;font-variant-numeric:tabular-nums}
.fab{display:none;position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;border-radius:24px;padding:11px 16px;background:var(--accent);color:var(--accent-ink);border:0;font-weight:700;box-shadow:var(--shadow)}

/* ---------- foglio A4 ---------- */
.page{width:794px;height:1123px;background:var(--paper);color:var(--paper-ink);box-shadow:var(--shadow);position:relative;flex:none;font-family:var(--doc);font-size:15px;line-height:1.38}
.page .hbar{position:absolute;left:56px;right:56px;top:30px;height:24px;background:var(--bar);color:#fff;font-size:12.5px;display:flex;align-items:center;justify-content:center;letter-spacing:.02em}
.page .pbody{position:absolute;left:62px;right:62px;top:64px}
.page.first .pbody{top:50px}
.page .pfoot{position:absolute;left:62px;right:62px;bottom:24px;font-size:11px;color:#6b7180;display:flex;justify-content:space-between;font-family:var(--val)}
.blk{margin:0 0 9px}
.c{text-align:center}.r{text-align:right}.b{font-weight:700}
.school{font-family:var(--val);font-size:14px;color:#444;margin:6px 0 2px;text-align:center}
.school-name{font-family:var(--val);font-size:20px;font-weight:700;text-align:center;margin-bottom:18px}
.h1{text-align:center;font-weight:700;font-size:17px;margin:2px 0}
.h1 span{background:#fff59a;text-decoration:underline}
.h2{text-align:center;font-weight:700;font-size:16px;margin:16px 0 4px}
.h2 u{text-underline-offset:3px}
.h2 .sub{display:block;font-weight:400;font-size:13.5px;margin-top:2px}
.h3{font-weight:700;font-size:15px;margin:12px 0 6px}
.h4{font-weight:700;margin:8px 0 4px}
.prow{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.prow .fill{flex:1;min-width:120px}

/* campi da compilare */
.fld,.line{font-family:var(--val);font-size:14px;color:var(--fill-ink);border:0;border-bottom:1px dotted #555;background:var(--fill-bg);padding:1px 4px;height:22px;border-radius:2px 2px 0 0;vertical-align:baseline;outline:none;min-width:0}
.fld:focus,.line:focus{background:#dfe9fb;border-bottom:1.5px solid var(--fill-ink)}
.page,.page *{color-scheme:light}
.page table,.page td,.page th,.page tr{color:var(--paper-ink);font-family:var(--doc);font-size:15px;line-height:1.38}
.page .opt,.page .ttl,.page label,.page span,.page div{color:inherit}
.fld,.line,table.grid th.vh .rot input{-webkit-text-fill-color:var(--fill-ink);opacity:1}
.fld::placeholder,.line::placeholder,table.grid th.vh .rot input::placeholder{color:#8a93a3;-webkit-text-fill-color:#8a93a3;font-size:12px;font-style:italic}
select.fld option,select.fld optgroup{color:#121418;background:#fff}
input.fld[type=date]::-webkit-datetime-edit{color:var(--fill-ink)}
select.fld{height:24px;padding:0 2px;cursor:pointer;-webkit-appearance:menulist;appearance:menulist}
input.fld[type=date]{height:24px;padding:0 4px;cursor:pointer}
.selwrap{display:inline-flex;align-items:center;gap:2px;vertical-align:baseline}
.selwrap .fld{width:100%}
.selwrap .back{border:0;background:none;color:var(--fill-ink);cursor:pointer;font-size:12px;padding:0 3px}
.prow .selwrap.fill{flex:1;min-width:120px}
.savech{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.savech button{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--chrome);border-radius:12px;padding:16px;cursor:pointer}
.savech button:hover,.savech button:focus-visible{border-color:var(--accent);background:var(--accent-soft)}
.savech b{font-size:18px}
.savech span{font-size:13px;color:var(--muted);line-height:1.35}
.savech .ico{width:34px;height:40px;border-radius:4px;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;box-sizing:border-box}
@media (max-width:420px){.savech{grid-template-columns:1fr}}
.lines{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.line{width:100%;display:block;box-sizing:border-box}
.cb{width:17px;height:17px;border:1.4px solid #222;background:#fff;border-radius:2px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex:none;vertical-align:-3px;position:relative}
.cb:hover{border-color:var(--fill-ink);box-shadow:0 0 0 3px #dfe9fb}
.cb.on::before,.cb.on::after{content:"";position:absolute;left:50%;top:50%;width:15px;height:2px;background:var(--fill-ink);border-radius:1px}
.cb.on::before{transform:translate(-50%,-50%) rotate(45deg)}
.cb.on::after{transform:translate(-50%,-50%) rotate(-45deg)}
.opt{display:inline-flex;align-items:flex-start;gap:8px;cursor:pointer;margin-right:14px;-webkit-tap-highlight-color:transparent}
.opt .cb{margin-top:2px}

/* gruppi di caselle */
.checks{display:grid;grid-template-columns:210px 1fr;gap:4px 14px;margin-bottom:10px}
.checks.full{grid-template-columns:1fr}
.checks .ttl{font-weight:700;font-size:14px;padding-top:1px}
.checks .items{display:flex;flex-direction:column;gap:4px}
.checks .opt{margin-right:0}
.checks .sub{margin-left:34px}
.checks .itemwrap{display:flex;flex-direction:column;gap:4px}
.boxed{border:1px solid var(--paper-line);padding:10px 12px 4px;margin-bottom:12px}

/* tabelle */
table.ft{width:100%;border-collapse:collapse;margin-bottom:12px;table-layout:fixed}
table.ft td,table.ft th{border:1px solid var(--paper-line);padding:6px 8px;vertical-align:top;font-weight:400;text-align:left}
table.ft td.cc{text-align:center;vertical-align:middle}
table.grid th.vh{height:130px;position:relative;padding:0}
table.grid th.vh .rot{position:absolute;top:calc(100% - 6px);left:calc(50% - 7px);width:116px;transform:rotate(-90deg);transform-origin:0 0;font-family:var(--val);font-size:11.5px;line-height:13px;text-align:left}
table.grid th.vh .rot input{width:112px;font-family:var(--val);font-size:11.5px;border:0;border-bottom:1px dotted #555;background:var(--fill-bg);color:var(--fill-ink);padding:1px 3px;outline:none}
table.grid td{text-align:center;vertical-align:middle;padding:5px 2px}
table.grid td.lbl{text-align:left;padding:6px 8px;font-size:14px;line-height:1.25}
table.grid td.lbl .fld{width:100%;margin-top:4px}
table.grid th.corner{font-weight:700;vertical-align:middle;text-align:center}
table.lv td{font-size:14px;line-height:1.3}
table.sig th{font-weight:700;text-align:center;font-size:13.5px}
table.sig td{height:30px;padding:3px 6px;vertical-align:middle}
table.sig .fld{width:100%;background:transparent;border-bottom:0}
table.sig .fld:focus{background:var(--fill-bg)}
ul.dl{margin:4px 0 10px;padding-left:26px}
ul.dl li{margin:2px 0}

/* modalità ritocco */
body.struct [data-path]{cursor:pointer;outline:1px dashed #9db4dd;outline-offset:2px}
body.struct [data-path].sel{outline:2px solid #e2771f;background:#fff4e8}
#structBar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:12px;padding:8px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;z-index:45;max-width:calc(100% - 32px)}
#structBar .hint{font-size:13px;color:var(--muted);align-self:center;padding:0 6px}

/* dialoghi e avvisi */
.dlg{position:fixed;inset:0;background:rgba(12,18,30,.45);display:flex;align-items:center;justify-content:center;z-index:80;padding:16px}
.dlg .card{background:var(--panel);color:var(--ink);border-radius:14px;box-shadow:var(--shadow);width:min(520px,100%);max-height:88vh;overflow:auto;padding:20px}
.dlg h2{margin:0 0 6px;font-size:19px;text-wrap:balance}
.dlg p{color:var(--muted);margin:6px 0 14px;line-height:1.45}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.dlg input[type=text]{width:100%;box-sizing:border-box;font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--chrome);color:var(--ink)}
.drop-zone{border:2px dashed var(--line);border-radius:12px;padding:26px 14px;text-align:center;cursor:pointer;color:var(--muted)}
.drop-zone:hover,.drop-zone.over{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stats div{background:var(--chrome);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.stats b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted)}
.mlist{display:flex;flex-direction:column;gap:6px}
.mlist .mi{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.mlist .mi .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.mlist .tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:1px 7px}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--desk);padding:11px 16px;border-radius:10px;opacity:0;transition:.25s;z-index:90;max-width:calc(100% - 32px);font-size:14px;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%)}
#busy{position:fixed;inset:0;background:rgba(12,18,30,.35);display:flex;align-items:center;justify-content:center;z-index:85;color:#fff;font-weight:700}
#busy div{background:var(--panel);color:var(--ink);padding:16px 22px;border-radius:12px;box-shadow:var(--shadow)}
#stage{position:fixed;left:-12000px;top:0;width:794px}
#stage .fld,#stage .line,.th .fld,.th .line{background:transparent}
.sv{display:inline-block;font-family:var(--val);font-size:14px;color:var(--fill-ink);border-bottom:1px dotted #555;padding:1px 4px;height:22px;line-height:20px;vertical-align:baseline;overflow:hidden;white-space:nowrap}
.sv.line{display:block}
table.sig .sv{border-bottom:0;width:100%}
#printArea{display:none}

@media (max-width:899px){
  .side{position:fixed;right:0;top:0;bottom:0;width:230px;z-index:56;transform:translateX(105%);transition:transform .25s;box-shadow:var(--shadow);padding-top:max(44px,env(safe-area-inset-top,0px));padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px);box-sizing:border-box}
  .side .thumbs{align-items:center}
  .sideX{display:block}
  .scrim{position:fixed;inset:0;background:rgba(12,18,30,.45);z-index:55}
  .side.open~.scrim{display:block}
  .side.open{transform:none}
  .fab{display:block}
  .prog .bar{display:none}
  #pages{padding:14px 0 100px;gap:14px}
}
@media (max-width:560px){
  .brand span{display:none}
  .prog{display:none}
  .modsel label{display:none}
  select{max-width:140px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  @page{size:A4;margin:0}
  html,body{height:auto;overflow:visible;background:#fff}
  body::before,#app,#toast,.fab,#structBar{display:none!important}
  #printArea{display:block}
  #printArea .page{box-shadow:none;page-break-after:always;break-after:page}
}
</style>

<div id="app">
  <header class="top">
    <div class="row1">
      <div class="brand"><i></i><span>Compila Moduli</span></div>
      <div class="menu" id="mFile"><button type="button">File</button>
        <div class="drop">
          <button type="button" data-act="newTab">Nuova scheda <small>modulo pulito</small></button>

          <button type="button" data-act="save">Salva documento… <small>PDF o Word</small></button>

          <button type="button" data-act="closeTab">Chiudi scheda</button>

          <button type="button" data-act="rename">Rinomina scheda</button>

          <button type="button" data-act="addMod">Aggiungi nuovo modulo… <small>da Word</small></button>

      <button type="button" class="cloudbtn" id="cloudBtn" data-s="off"><span class="dot"></span><span class="lbl">Solo su questo dispositivo</span></button>

</div>

<script>
"use strict";
/* ================= modulo PDP di base ================= */

{t:"levels",id:"liv",rows:[
 ["Pre-A1","In questa fase è massima la dipendenza dell’apprendente, nella pianificazione del discorso, dall’interlocutore e dal contesto situazionale e discorsivo. Il massimo sforzo di apprendimento è volto al riconoscimento e alla memorizzazione di vocaboli, e alla strutturazione di enunciati a partire dai suggerimenti del nativo. È alta la presenza di costrutti fissi e formule, pezzi di lingua non analizzati e di singole parole, che possono designare oggetti, persone, azioni ma anche intere situazioni."],

function structOp(op){const t=curTab(),m=modById(t.moduleId);const [bi,ri,ci]=selPath.split(".").map(Number);let blk=m.blocks[bi];let host=blk;if(ri!=null)host=blk.rows[ri][ci];
  const ids=()=>uid("f");
  if(op==="del"){m.blocks.splice(bi,1);selPath=null}
  else if(op==="br"){m.blocks.splice(bi,0,{t:"br"});selPath=String(bi+1)}
  else if(op==="head"){if(blk.t==="h")m.blocks[bi]={t:"p",parts:[blk.text]};else{const tx=(blk.parts||[]).map(x=>typeof x==="string"?x:(x.b||x.label||"")).join("").trim();m.blocks[bi]={t:"h",lvl:4,text:tx}}}
  else{if(host.t==="h"){host={t:"p",parts:[host.text]};m.blocks[bi]=host}
    const parts=host.parts||(host.parts=[]);
    if(op==="box"){if(parts[0]&&parts[0].c){parts.shift()}else parts.unshift({c:ids(),label:null});if(ri!=null)host.cc=parts.length===1}
    if(op==="field"){parts.push({f:ids(),w:"fill"});host.cc=false}
    if(op==="date"){parts.push({f:ids(),type:"date",w:150});host.cc=false}
    if(op==="plain"){host.parts=parts.filter(x=>typeof x==="string"||x.b||x.br);host.cc=false}
  }

}
